# MatList production stack — app + PostgreSQL + Caddy (HTTPS อัตโนมัติ).
# ใช้คู่กับ docs/DEPLOY.md (ทางเลือก A). รันจาก REPO ROOT:
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# ก่อนรัน: สร้างไฟล์ deploy/.env.prod (ดูตัวอย่างใน docs/DEPLOY.md) และแก้
# deploy/Caddyfile ให้เป็นโดเมนจริงของคุณ

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: matlist
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env.prod}
      POSTGRES_DB: matlist
    volumes:
      - matlist-prod-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matlist -d matlist"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://matlist:${DB_PASSWORD}@db:5432/matlist?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in deploy/.env.prod}
      AUTH_TRUST_HOST: "true"
      OPS_EMAILS: ${OPS_EMAILS:-}
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - matlist-caddy-data:/data
      - matlist-caddy-config:/config

volumes:
  matlist-prod-db:
  matlist-caddy-data:
  matlist-caddy-config:
